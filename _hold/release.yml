name: Release Windows build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (e.g. 0.5.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "$V" > VERSION

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.3"

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean packaging/hantek-bench.spec

      - name: Zip portable onedir
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path "dist\HantekBench\*" -DestinationPath "dist\HantekBench-$v-windows-portable.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$v" `
            "packaging\hantek-bench.iss"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hantek-bench-windows-${{ steps.ver.outputs.version }}
          path: |
            dist/HantekBench-*-windows-portable.zip
            dist/HantekBench-*-windows-setup.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Hantek Bench ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/HantekBench-*-windows-portable.zip
            dist/HantekBench-*-windows-setup.exe
          body: |
            Windows builds for **Hantek Bench** (Hantek 6022BL).

            ### Downloads
            - **Installer** — `HantekBench-*-windows-setup.exe` (recommended)
            - **Portable** — unzip and run `HantekBench.exe`

            ### Notes
            - Opens http://127.0.0.1:8787 automatically.
            - Scope mode needs the physical **H/P** button pressed and WinUSB (OpenHantek) driver.
            - Optional LA / sigrok capture: install [sigrok-cli](https://sigrok.org/wiki/Downloads) and set `HTK_SIGROK_CLI`, or place it under `%LOCALAPPDATA%\hantek-bench\sigrok-cli\`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
